name: "James O'Donnell"
title: "Partner"
firm: "Gibson Dunn"
bio: "James O'Donnell is a Partner in Gibson Dunn's London office and a member of the firm's Investment Funds Practice Group. He advises LP investors and sponsors on capital raising and fund transactions, including primary investments, GP-led and LP-led secondaries, co-investments, fund formation, management spin-outs and fund restructurings. His clients include funds of funds, sovereign wealth funds, pension plans, insurers, development finance institutions and fund managers, and he has a particular focus on impact and developmental investing. He has been ranked Band 1 for investor representation by Chambers & Partners since 2022 and is a lead contributor to the training programme of the Institutional Limited Partners Association (ILPA). Before joining Gibson Dunn, he co-chaired the investment funds practice at another U.S. law firm."
