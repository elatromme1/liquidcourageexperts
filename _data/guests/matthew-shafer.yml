name: "Matthew Shafer"
title: "Managing Director, Head of Golub Equity Continuation Partners"
firm: "Golub Capital"
bio: "Matthew Shafer joined Golub Capital in 2026 and is a Managing Director and Head of Golub Equity Continuation Partners. He is responsible for acting as portfolio manager for the strategy and leading the origination, underwriting and monitoring of the Firm's equity continuation investments. Prior to joining Golub Capital, Shafer was Head of Capital Solutions and U.S. Private Equity for Northleaf Capital Partners, where he led the firm's New York-based private equity investment activities with a focus on secondaries, co-investments and structured capital. Before that, he worked at Vision Capital as a Partner and Head of Americas Private Equity. Shafer started his career in investment banking at CIBC World Markets and Lehman Brothers. He earned his BA in History from Dartmouth College."
