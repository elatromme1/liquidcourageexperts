name: "Peter Wright"
title: "Director"
firm: "Hark Capital"
bio: "Peter Wright is a Director at Hark Capital, which he joined in 2024. He is responsible for investment origination and execution. Before Hark, he was at Devon Park Advisors and Campbell Lutyens, where he led origination, execution, and syndication across a range of secondaries transactions, including LP interest acquisitions, GP-led restructurings, and strategic equity placements. Earlier, he was an Associate at Stellex Capital Management. Wright holds a B.B.A. from Howard University and an M.B.A. from the University of Chicago."
