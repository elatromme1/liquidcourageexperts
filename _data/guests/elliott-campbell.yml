name: "Elliott Campbell"
title: "Principal, Portfolio Manager"
firm: "HarbourVest"
bio: "Elliott Campbell is a Principal at HarbourVest and the Portfolio Manager for the HarbourVest US Secondary Evergreen Fund (HSEC), where he focuses on portfolio construction, investment strategy, and fundraising for the firm's US evergreen secondaries platform. He joined HarbourVest in 2013 and has worked on its secondary investments and direct co-investment teams, spending nearly a decade sourcing, executing, and monitoring co-investments with a focus on healthcare services and software, and serving as a board member across multiple portfolio companies. Earlier in his career, Campbell worked in investment banking in the Leveraged Finance Group at Wells Fargo and held a general management role at Johnson & Johnson. He holds a BA in Political Science from Davidson College and an MBA from Harvard Business School."
