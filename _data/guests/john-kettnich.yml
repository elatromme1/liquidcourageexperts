name: "John Kettnich"
title: "Partner"
firm: "StepStone"
bio: "John Kettnich is a Partner at StepStone, where he is a member of the private equity team focused on secondary investments and sits on the firm's private equity investment committee. Since StepStone's inception, he has helped build the firm's primary diligence and research platform as well as its secondaries business, and he spent time in Beijing and London developing StepStone's international business. Before joining StepStone in 2007, Kettnich sourced and evaluated middle-market buyout and growth equity investments at PCG Capital Partners, the direct investment arm of Pacific Corporate Group. He graduated summa cum laude from the University of San Diego and is a CFA charterholder."
