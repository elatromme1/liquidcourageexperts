name: "Gerald Cooper"
title: "Partner"
firm: "Lazard CL"
bio: "Gerald Cooper is a Partner and Global Co-head of the Secondaries advisory practice, and a member of the Management and Operations Committees. He also has specific responsibility for the North America secondaries practice and is Co-Chair of the Secondary Business Committee. Since joining Campbell Lutyens in 2016, Cooper has built the North America secondaries team into one of the largest and most respected in the industry, and has led a number of major secondary mandates for blue chip US institutional investors as well as for leading GPs on the creation of continuation funds. Prior to Campbell Lutyens, he spent 12 years at UBS advising on secondary transactions, most recently as Global Co-head of Secondary Advisory in the Private Funds Group in New York. Before specializing in the secondary market, he worked at Advantage Capital Partners focusing on direct investments in the Midwest and Southeast, and previously in corporate finance and equity capital markets at Deutsche Bank and Bankers Trust Company in New York and Hong Kong. Cooper graduated magna cum laude from Bryant University with a BS in Business Administration and earned his MBA from Harvard Business School."
