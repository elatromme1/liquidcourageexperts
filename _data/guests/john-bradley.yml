name: "John Bradley"
title: "Head of Private Markets, Managing Director - Private Equity"
firm: "Florida State Board of Administration"
bio: "John Bradley is Head of Private Markets and Managing Director - Private Equity at the Florida State Board of Administration (SBA), which invests the assets of the Florida Retirement System. He sits on the SBA's investment committee and has led its private equity program, where he pioneered the use of secondary sales, before being named to head private markets investments in 2026. He is an active member of the Institutional Limited Partners Association (ILPA) and served six years on its Research, Benchmarking and Standards Committee. He chairs the investment committee of the Florida State University Foundation and of the Community Foundation of North Florida. He holds a bachelor's degree in finance and multinational business and an MBA from Florida State University."
