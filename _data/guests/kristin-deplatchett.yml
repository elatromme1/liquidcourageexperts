name: "Kristin DePlatchett"
title: "Managing Director"
firm: "Bonaccord Capital Partners"
bio: "Kristin DePlatchett is a Managing Director at Bonaccord Capital Partners, with an exclusive focus on sourcing, research, origination, and partner sponsor coverage. Before joining Bonaccord, DePlatchett was a Partner at Trilantic North America in New York. She also previously served as the Managing Partner at Kraken Capital in New York, and as a Managing Director at StepStone Group in New York and La Jolla. DePlatchett started her private equity career at Fort Washington Capital Partners Group in Cincinnati. She graduated Phi Beta Kappa from the University of North Carolina-Chapel Hill, where she received a B.A. in Economics with a Business Administration minor. DePlatchett played on the women's soccer team at UNC, winning two NCAA National Championship titles, and was subsequently drafted to play professional soccer for the Atlanta Beat of the Women's United Soccer Association (WUSA)."
